<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المساعد الذكي</title>
<style>body{font-family:Arial;background:#0f172a;color:white;display:flex;flex-direction:column;align-items:center;padding:20px}#chat{background:#1e293b;width:100%;max-width:600px;height:380px;overflow-y:auto;padding:15px;border-radius:12px;margin-bottom:12px}.msg{margin:8px 0;padding:10px;border-radius:8px;line-height:1.6}.user{background:#2563eb}.bot{background:#334155}input{width:68%;padding:12px;border-radius:8px;border:none}button{padding:12px 16px;background:#22c55e;color:white;border:none;border-radius:8px}</style>
</head>
<body>
<h2>🤖 المساعد الذكي</h2>
<div id="chat"><div class="msg bot">مرحبا! أنا جاهز الآن، اسألني أي شيء</div></div>
<div style="display:flex;width:100%;max-width:630px"><input id="q" placeholder="اكتب سؤالك..."><button onclick="ask()">إرسال</button></div>
<script>
async function ask(){
 const input=document.getElementById("q"); const text=input.value.trim(); if(!text) return;
 const chat=document.getElementById("chat"); chat.innerHTML+=`<div class="msg user">${text}</div>`; input.value="";
 chat.scrollTop=chat.scrollHeight;
 try{
  const res=await fetch("/.netlify/functions/gemini",{method:"POST",body:JSON.stringify({message:text})});
  const data=await res.json();
  chat.innerHTML+=`<div class="msg bot">${(data.reply||data.error).replace(/\n/g,"<br>")}</div>`;
 }catch(e){chat.innerHTML+=`<div class="msg bot">خطأ في الاتصال: ${e.message}</div>`}
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
