<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد الذكي</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white flex flex-col h-screen max-w-2xl mx-auto">
<h2 class="text-center p-4 text-xl font-bold">🤖 المساعد الذكي</h2>
<div id="chat" class="flex-1 overflow-auto p-4 flex flex-col gap-3">
<div class="bg-[#1e293b] p-3 rounded-xl self-start">مرحبا! أنا جاهز الآن 🚀</div>
</div>
<div class="p-4 flex gap-2">
<input id="input" class="flex-1 p-3 rounded-full bg-slate-800 outline-none" placeholder="اكتب سؤالك...">
<button onclick="ask()" class="bg-blue-600 px-6 py-3 rounded-full">إرسال</button>
</div>
<script>
async function ask(){
 const input=document.getElementById('input');
 const chat=document.getElementById('chat');
 const txt=input.value.trim();
 if(!txt) return;
 chat.innerHTML+=`<div class="bg-blue-600 p-3 rounded-xl self-end max-w-[80%]">${txt}</div>`;
 input.value='';
 const id='b'+Date.now();
 chat.innerHTML+=`<div id="${id}" class="bg-[#1e293b] p-3 rounded-xl self-start">يكتب...</div>`;
 chat.scrollTop=chat.scrollHeight;
 try{
  const r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})});
  const d=await r.json();
  document.getElementById(id).innerText=d.reply;
 }catch(e){
  document.getElementById(id).innerText='خطأ في الاتصال';
 }
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
